<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lexicon</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="theme-color" content="#005da7" />
<meta name="apple-mobile-web-app-title" content="Lexicon" />
<script>try{var t=JSON.parse(localStorage.getItem('lw_theme_v1'));if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
<div id="root"></div>
<script>
/* Startup watchdog: a failed script load or a JS error before React mounts
   leaves an empty #root. Collect errors and, if the app hasn't started, show them. */
(function () {
  var errors = [];
  function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function reload() { location.replace(location.pathname + '?r=' + Date.now() + location.hash); }
  function html(lines) {
    return '<div style="max-width:560px;margin:48px auto;padding:24px 16px;font:15px/1.5 system-ui,sans-serif;color:var(--on-surface,#1b2228)">'
      + '<h2 style="margin:0 0 8px;font-size:20px">Lexicon could not start</h2>'
      + '<p style="margin:0 0 12px;color:var(--on-surface-variant,#555)">Check the connection and reload. If it keeps happening, send this text to the developer:</p>'
      + '<pre style="white-space:pre-wrap;word-break:break-word;background:var(--surface-high,#eef1f4);padding:12px;border-radius:12px;font-size:12px;max-height:40vh;overflow:auto">'
      + esc(lines.join('\n') || 'No error was reported.') + '\n\n' + esc(navigator.userAgent) + '</pre>'
      + '<button type="button" id="lw-fatal-reload" style="margin-top:12px;padding:10px 18px;border:0;border-radius:999px;background:var(--primary,#2b5bd7);color:#fff;font-weight:700;font-size:15px">Reload</button></div>';
  }
  function show() {
    var root = document.getElementById('root');
    if (window.lwAppStarted || !root || root.childElementCount) return;
    root.innerHTML = html(errors);
    document.getElementById('lw-fatal-reload').onclick = reload;
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href)) errors.push('Failed to load ' + (t.src || t.href));
    else errors.push((e.message || 'Error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
    if (document.readyState === 'complete') setTimeout(show, 500);
  }, true);
  window.addEventListener('load', function () { setTimeout(show, 15000); });
  /* used by LwErrorBoundary in app.jsx once React is running; h is React.createElement */
  window.lwRenderFatal = function (error, h) {
    var lines = [(error && error.message) || String(error), String((error && error.stack) || '').split('\n').slice(1, 6).join('\n')];
    return h('div', {
      dangerouslySetInnerHTML: { __html: html(lines) },
      onClick: function (e) { if (e.target.id === 'lw-fatal-reload') reload(); },
    });
  };
})();
</script>

<script type="module" src="/app.jsx"></script>
</body>
</html>
