<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lexicon</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<script>try{var t=JSON.parse(localStorage.getItem('lw_theme_v1'));if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Lucid Mentor (stitch_/lingoflow/DESIGN.md). Light values come from the design system. */
  --surface: #f5f7f9;            /* page background */
  --surface-low: #eef1f3;        /* sections, secondary fills */
  --surface-lowest: #ffffff;     /* cards, primary interactive surfaces */
  --surface-high: #dfe3e6;       /* secondary buttons */
  --surface-highest: #d9dde0;    /* progress tracks */
  --on-surface: #2c2f31;
  --on-surface-variant: #595c5e;
  --faint: #8a8d90;
  --outline-variant: #abadaf;
  --ghost: color-mix(in srgb, var(--outline-variant) 30%, transparent); /* "ghost border" fallback */
  --primary: #005da7;
  --primary-container: #68abff;
  --on-primary: #eef3ff;
  --primary-soft: #e6f0fc;
  --secondary: #7f5200;          /* success / correct / mastered */
  --secondary-container: #ffc87f;
  --on-secondary-container: #644000;
  --tertiary: #006571;
  --tertiary-fixed: #58e7fb;
  --error: #b31b25;
  --gradient-cta: linear-gradient(135deg, var(--primary), var(--primary-container));
  --gradient-progress: linear-gradient(90deg, var(--tertiary), var(--tertiary-fixed));
  --glass: rgb(255 255 255 / 80%);
  --scrim: rgb(11 15 16 / 45%);
  --shadow-ambient: 0 12px 32px -8px rgb(44 47 49 / 8%);
  --shadow-card: 0 2px 6px rgb(44 47 49 / 4%), 0 24px 48px -12px rgb(44 47 49 / 12%);
  --radius-xl: 24px;
  --radius-lg: 16px;
  --radius: 16px;
  --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  color-scheme: light;
}
/* Dark theme: not defined by DESIGN.md — our own tonal ladder in the same blue family */
html[data-theme="dark"] {
  --surface: #0f1417;
  --surface-low: #151b1f;
  --surface-lowest: #1b2228;
  --surface-high: #262f36;
  --surface-highest: #2f3941;
  --on-surface: #e3e8ec;
  --on-surface-variant: #a3abb2;
  --faint: #6f7881;
  --outline-variant: #5a646c;
  --primary: #68abff;
  --primary-container: #2f7fd0;
  --on-primary: #001d38;
  --primary-soft: #16283a;
  --secondary: #ffb548;
  --secondary-container: #4a3200;
  --on-secondary-container: #ffd9a3;
  --tertiary: #0097a7;
  --tertiary-fixed: #45d8ed;
  --error: #ff6b6b;
  --gradient-cta: linear-gradient(135deg, #2f7fd0, #68abff);
  --glass: rgb(27 34 40 / 80%);
  --scrim: rgb(0 0 0 / 55%);
  --shadow-ambient: 0 12px 32px -8px rgb(0 0 0 / 45%);
  --shadow-card: 0 2px 8px rgb(0 0 0 / 30%), 0 24px 48px -12px rgb(0 0 0 / 55%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow-x: hidden; }
body {
  background: var(--surface);
  color: var(--on-surface);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .brand-name, .empty-title, .lib-title, .reading-title, .grp-name, .modal-head h3, .lang-select-title { font-family: var(--font-display); }
.app, .appbar, .card-face, .grp, .chip, .btn, .input, .modal { transition: background-color .3s ease, border-color .3s ease; }
#root { min-height: 100%; }
button { font-family: inherit; cursor: pointer; }
::selection { background: var(--primary); color: var(--on-primary); }

.app { min-height: 100dvh; display: flex; flex-direction: column; }

/* ---------- App shell: app bar, drawer / sidebar, tab bar ---------- */
.app-main { min-height: 100dvh; display: flex; flex-direction: column; }
.appbar {
  position: sticky; top: 0; z-index: 20;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
  background: var(--glass);
  backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2);
  box-shadow: 0 1px 0 color-mix(in srgb, var(--outline-variant) 15%, transparent);
}
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.03em; color: var(--primary); }
.level-chip {
  display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer;
  background: var(--surface-low); color: var(--on-surface); border-radius: 999px;
  padding: 7px 13px; font-size: 13px; font-weight: 700; letter-spacing: .02em;
}
.level-chip svg { color: var(--secondary); }

.drawer-scrim {
  position: fixed; inset: 0; z-index: 40; background: var(--scrim);
  opacity: 0; pointer-events: none; transition: opacity .2s ease;
}
.drawer-scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 41;
  width: min(320px, 86vw); overflow-y: auto;
  display: flex; flex-direction: column; gap: 6px;
  padding: 20px 16px max(20px, env(safe-area-inset-bottom));
  background: var(--surface-lowest);
  border-radius: 0 var(--radius-xl) var(--radius-xl) 0;
  box-shadow: var(--shadow-card);
  transform: translateX(-105%); transition: transform .26s cubic-bezier(.2,.8,.2,1);
}
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; gap: 12px; padding: 4px 4px 14px; }
.drawer-logo {
  width: 44px; height: 44px; border-radius: 14px; flex: 0 0 auto;
  display: grid; place-items: center; color: #fff; background: var(--gradient-cta);
  box-shadow: 0 8px 18px -8px var(--primary);
}
.drawer-brand { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.drawer-sub { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--primary); }
.drawer-close { background: var(--surface-low); }
.drawer-profile {
  display: flex; flex-direction: column; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  border: 0; border-radius: var(--radius-xl); padding: 14px; margin-bottom: 10px;
  background: var(--surface-low); color: var(--on-surface);
}
.drawer-profile-top { display: flex; align-items: center; gap: 12px; }
.drawer-profile-text { display: flex; flex-direction: column; min-width: 0; }
.drawer-name { font-family: var(--font-display); font-weight: 800; font-size: 16px; overflow: hidden; text-overflow: ellipsis; }
.drawer-meta { font-size: 13px; color: var(--on-surface-variant); }
.drawer-streak {
  display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 14px;
  background: var(--surface-lowest); font-size: 14px; font-weight: 700; color: #d9661a;
}
html[data-theme="dark"] .drawer-streak { color: #ff9a4d; }
.streak-badge {
  margin-left: auto; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
  background: var(--surface-high); color: var(--on-surface-variant);
}
.streak-badge.on { background: var(--secondary-container); color: var(--on-secondary-container); }
.avatar {
  width: 44px; height: 44px; border-radius: 50%; flex: 0 0 auto;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 18px;
  background: var(--primary-container); color: #fff;
}
.avatar-lg { width: 72px; height: 72px; font-size: 30px; }
.drawer-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 14px; width: 100%; border: 0; cursor: pointer;
  background: transparent; color: var(--on-surface); text-align: left;
  font-size: 15px; font-weight: 600; padding: 13px 14px; border-radius: var(--radius-lg);
  transition: background .15s ease, color .15s ease;
}
.nav-item svg { flex: 0 0 auto; width: 20px; height: 20px; }
.nav-item:hover { background: var(--surface-low); }
.nav-item.on { background: var(--primary-soft); color: var(--primary); }
.nav-label { flex: 1; }
.nav-badge {
  padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
  background: var(--surface-low); color: var(--on-surface-variant);
}
.nav-badge-hot { background: var(--primary); color: #fff; }
html[data-theme="dark"] .nav-badge-hot { color: var(--on-primary); }
.drawer-section {
  margin: 14px 14px 4px; font-size: 11.5px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--faint);
}
.switch {
  position: relative; width: 44px; height: 26px; flex: 0 0 auto; border-radius: 999px;
  background: var(--surface-highest); transition: background .2s ease;
}
.switch::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / 20%); transition: transform .2s ease;
}
.switch.on { background: var(--primary); }
.switch.on::after { transform: translateX(18px); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  padding: 8px 10px max(8px, env(safe-area-inset-bottom));
  background: var(--glass);
  backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  box-shadow: 0 -8px 24px -12px rgb(44 47 49 / 12%);
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; cursor: pointer;
  background: transparent; color: var(--faint); border-radius: var(--radius-lg); padding: 8px 4px;
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  transition: background .15s ease, color .15s ease;
}
.tab svg { width: 22px; height: 22px; }
.tab.on { background: var(--primary-soft); color: var(--primary); }

/* ---------- Learn ---------- */
.learn { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.learn-head { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
.goal { display: flex; flex-direction: column; gap: 8px; }
.goal-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.goal-label { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--on-surface-variant); }
.goal-count { font-size: 13px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: .03em; }
.goal-count.met { color: var(--secondary); }
.goal-track { height: 8px; border-radius: 999px; background: var(--surface-highest); overflow: hidden; }
.goal-fill { height: 100%; border-radius: inherit; background: var(--gradient-progress); transition: width .4s ease; }
.mode-pills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; background: var(--surface-low); border-radius: 999px; }
.mode-pill {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 0; cursor: pointer; background: transparent; color: var(--on-surface-variant);
  border-radius: 999px; padding: 9px 6px; font-size: 13.5px; font-weight: 700;
  transition: background .15s ease, color .15s ease;
}
.mode-pill:hover { color: var(--on-surface); }
.mode-pill.on { background: var(--surface-lowest); color: var(--primary); box-shadow: var(--shadow-ambient); }
.mode-pill-count {
  min-width: 18px; padding: 1px 6px; border-radius: 999px; font-size: 11px;
  background: var(--primary); color: #fff;
}
html[data-theme="dark"] .mode-pill-count { color: var(--on-primary); }
.learn-sub { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.groups-chip {
  display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer;
  background: var(--surface-high); color: var(--on-surface); border-radius: 999px;
  padding: 7px 12px; font-size: 13px; font-weight: 700;
}
.groups-chip:hover { background: var(--surface-highest); }
.learn-session { font-size: 12.5px; font-weight: 600; color: var(--on-surface-variant); }
.study { width: 100%; }

.answer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 440px; }
.answer-btn {
  display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; cursor: pointer;
  padding: 16px 10px 14px; border-radius: var(--radius-xl);
  font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  transition: transform .12s ease, box-shadow .15s ease, filter .15s ease;
}
.answer-btn:hover { transform: translateY(-2px); }
.answer-btn:active { transform: scale(.98); }
.answer-icon { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
.answer-int { font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: none; opacity: .75; }
.answer-again { background: var(--surface-high); color: var(--on-surface-variant); }
.answer-again .answer-icon { background: var(--surface-lowest); color: var(--error); }
.answer-know { background: var(--gradient-cta); color: #fff; box-shadow: 0 14px 28px -12px var(--primary); }
.answer-know .answer-icon { background: rgb(255 255 255 / 22%); }
html[data-theme="dark"] .answer-know { color: var(--on-primary); }

/* ---------- Profile & dashboard ---------- */
.profile { width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.profile-card {
  display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  padding: 26px 20px 22px; border-radius: var(--radius-xl); box-shadow: var(--shadow-ambient);
  background: radial-gradient(120% 70% at 85% 0%, var(--primary-soft), transparent 60%), var(--surface-lowest);
}
.profile-avatar-wrap { position: relative; margin-bottom: 6px; }
img.avatar { object-fit: cover; background: var(--surface-low); }
.avatar-xl { width: 104px; height: 104px; font-size: 42px; box-shadow: 0 0 0 4px var(--surface-lowest), 0 0 0 7px var(--primary-container); }
.avatar-edit {
  position: absolute; right: -2px; bottom: -2px; width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
  display: grid; place-items: center; background: var(--surface-lowest); color: var(--primary); box-shadow: var(--shadow-card);
}
.avatar-edit:hover { color: var(--on-surface); }
.level-pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
  background: var(--surface-low); color: var(--primary); font-size: 13px; font-weight: 700;
}
.level-pill svg { color: var(--secondary); }
.profile-name { margin: 2px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.profile-handle { margin: 0; color: var(--on-surface-variant); font-size: 14px; }
.learning-chip {
  margin-top: 6px; padding: 9px 16px; border-radius: 999px; background: var(--surface-high);
  font-size: 14px; font-weight: 600; color: var(--on-surface);
}
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  padding: 16px 8px 14px; border-radius: var(--radius-xl); background: var(--surface-lowest); box-shadow: var(--shadow-ambient);
}
.tile-icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 4px; }
.tile-icon-blue { background: var(--primary-soft); color: var(--primary); }
.tile-icon-gold { background: color-mix(in srgb, var(--secondary-container) 45%, transparent); }
.tile-icon-teal { background: color-mix(in srgb, var(--tertiary-fixed) 22%, transparent); color: var(--tertiary); }
.tile-num { font-family: var(--font-display); font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.tile-label { font-size: 12px; font-weight: 600; color: var(--on-surface-variant); }
.dash-card {
  display: flex; flex-direction: column; gap: 12px; padding: 20px;
  border-radius: var(--radius-xl); background: var(--surface-lowest); box-shadow: var(--shadow-ambient);
}
.dash-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.dash-title { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.dash-sub { margin: 2px 0 0; font-size: 13px; color: var(--on-surface-variant); }
.dash-badge { flex: 0 0 auto; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: var(--primary-soft); color: var(--primary); }
.dash-badge.met { background: var(--secondary-container); color: var(--on-secondary-container); }

/* week chart */
.week-chart { display: flex; flex-direction: column; gap: 8px; padding-top: 18px; }
.week-plot { position: relative; height: 130px; display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; border-bottom: 1px solid var(--surface-highest); }
.week-goal { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--outline-variant); pointer-events: none; }
.week-goal-label { position: absolute; right: 0; bottom: 3px; font-size: 11px; font-weight: 700; color: var(--on-surface-variant); background: var(--surface-lowest); padding-left: 4px; }
.week-col { position: relative; height: 100%; display: flex; align-items: flex-end; justify-content: center; outline: none; cursor: default; }
.week-col:focus-visible .week-bar { box-shadow: 0 0 0 2px var(--surface-lowest), 0 0 0 4px var(--primary); }
.week-bar {
  width: min(24px, 60%); min-height: 0; border-radius: 4px 4px 0 0;
  background: color-mix(in srgb, var(--primary) 32%, var(--surface-lowest)); transition: filter .15s ease, height .3s ease;
}
.week-col.today .week-bar { background: var(--primary); }
.week-col.hover .week-bar { filter: brightness(1.12); }
.week-val { position: absolute; transform: translateY(-4px); font-size: 12px; font-weight: 700; color: var(--on-surface); }
.week-tip {
  position: absolute; z-index: 5; white-space: nowrap; pointer-events: none;
  padding: 6px 10px; border-radius: 10px; font-size: 12px; font-weight: 600;
  background: var(--on-surface); color: var(--surface-lowest); box-shadow: var(--shadow-card);
}
.week-col:first-child .week-tip { left: 0; }
.week-col:last-child .week-tip { right: 0; }
.week-labels { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; font-weight: 600; color: var(--on-surface-variant); }
.week-labels .today { color: var(--primary); font-weight: 800; }

/* words by status (palette validated with the dataviz checker, light + dark) */
:root { --st-new: var(--surface-highest); --st-learning: #0097a7; --st-review: #005da7; --st-mastered: #c27d0e; }
html[data-theme="dark"] { --st-learning: #22a08a; --st-review: #5b8ff0; --st-mastered: #b98019; }
.status-bar { display: flex; gap: 2px; height: 12px; border-radius: 999px; overflow: hidden; }
.status-seg { min-width: 6px; }
.status-new { background: var(--st-new); }
.status-learning { background: var(--st-learning); }
.status-review { background: var(--st-review); }
.status-mastered { background: var(--st-mastered); }
.status-legend { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 16px; }
.status-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.status-swatch { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
.status-name { flex: 1; color: var(--on-surface-variant); font-weight: 600; }
.status-num { font-family: var(--font-display); font-weight: 800; }

/* CEFR */
.cefr-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.cefr-label { width: 48px; font-size: 13px; font-weight: 700; color: var(--on-surface-variant); }
.cefr-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.cefr-pill {
  min-width: 42px; padding: 7px 10px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--surface-high); color: var(--on-surface); font-size: 13px; font-weight: 700;
}
.cefr-pill:hover { background: var(--surface-highest); }
.cefr-pill.on { background: var(--primary); color: #fff; }
html[data-theme="dark"] .cefr-pill.on { color: var(--on-primary); }

/* nudge */
.cta-card { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 26px 20px; border-radius: var(--radius-xl); background: var(--surface-high); }
.cta-title { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.cta-sub { margin: 0 0 8px; color: var(--on-surface-variant); font-size: 14px; }
.setting-stack { display: flex; flex-direction: column; }
.setting-sub { font-size: 12.5px; font-weight: 500; color: var(--on-surface-variant); }

/* offline */
.offline-bar {
  display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 16px;
  background: var(--secondary-container); color: var(--on-secondary-container); font-size: 13px; font-weight: 600; text-align: center;
}

/* Google button (white, per Google's branding guidance) + "or" divider */
.btn.btn-google { width: 100%; background: #fff; color: #1f1f1f; border: 1px solid #dadce0; }
.btn.btn-google:hover { background: #f8f9fa; }
html[data-theme="dark"] .btn.btn-google { background: #131314; color: #e3e3e3; border-color: #8e918f; }
.or-sep { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--faint); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
.or-sep::before, .or-sep::after { content: ''; flex: 1; height: 1px; background: var(--ghost); }

.section-label {
  margin: 16px 6px 2px; font-size: 11.5px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--faint);
}
.settings-list { display: flex; flex-direction: column; border-radius: var(--radius-xl); overflow: hidden; background: var(--surface-lowest); box-shadow: var(--shadow-ambient); }
.setting-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  width: 100%; padding: 14px 18px; border: 0; background: transparent; color: var(--on-surface);
  font: inherit; font-size: 15px; font-weight: 600; text-align: left;
}
button.setting-row { cursor: pointer; transition: background .15s ease; }
button.setting-row:hover { background: var(--surface-low); }
.setting-row:nth-child(even) { background: color-mix(in srgb, var(--surface-low) 50%, transparent); }
.setting-label { display: inline-flex; align-items: center; gap: 12px; }
.setting-label svg { color: var(--on-surface-variant); }
.setting-value { display: inline-flex; align-items: center; gap: 4px; color: var(--on-surface-variant); font-size: 14px; }
.setting-danger, .setting-danger .setting-label svg { color: var(--error); }

/* ---------- Library: Words view ---------- */
.lib-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.words-pane { display: flex; flex-direction: column; gap: 16px; }
.wotd {
  position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  padding: 22px; border-radius: var(--radius-xl);
  background: linear-gradient(160deg, var(--primary-soft), color-mix(in srgb, var(--primary-container) 22%, var(--surface-lowest)));
}
.wotd-kicker {
  padding: 4px 10px; border-radius: 999px; background: var(--primary); color: #fff;
  font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
}
html[data-theme="dark"] .wotd-kicker { color: var(--on-primary); }
.wotd-head { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.wotd-head .card-speak { position: static; }
.wotd-word { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -.03em; color: var(--primary); }
.wotd-ipa { margin: 0; font-style: italic; color: var(--on-surface-variant); }
.wotd-tr { margin: 4px 0 0; font-size: 16px; font-weight: 600; }
.wotd-ex { margin: 0 0 8px; color: var(--on-surface-variant); font-size: 14.5px; line-height: 1.5; max-width: 52ch; }
.wotd-art { position: absolute; right: 18px; bottom: 14px; width: 72px; height: 72px; color: var(--primary-container); opacity: .45; pointer-events: none; }
.lib-filters { display: flex; flex-direction: column; gap: 10px; }
.status-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.status-chips::-webkit-scrollbar { display: none; }
.status-chips .chip { flex: 0 0 auto; }
.lib-selects { display: flex; gap: 8px; flex-wrap: wrap; }
.input.input-sm { width: auto; padding: 8px 12px; font-size: 13.5px; border-radius: 999px; background: var(--surface-lowest); }
.tag-pos {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--radius-lg);
  background: var(--surface-low); font-size: 13.5px; color: var(--on-surface-variant);
}
.tag-pos-error { color: var(--error); font-weight: 600; }
.wcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.wcard {
  display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 12px;
  border-radius: var(--radius-xl); background: var(--surface-lowest); box-shadow: var(--shadow-ambient);
}
.wcard-top { display: flex; align-items: center; gap: 8px; }
.wcard-top .card-speak { position: static; margin-left: auto; width: 30px; height: 30px; }
.wcard-group { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; font-weight: 600; color: var(--on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wcard-group .grp-dot { width: 8px; height: 8px; }
.wcard-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.wcard-word { font-family: var(--font-display); font-size: 19px; font-weight: 800; letter-spacing: -.01em; overflow-wrap: anywhere; }
.wcard-ipa { font-style: italic; font-size: 13.5px; color: var(--on-surface-variant); }
.wcard-pos { font-size: 12px; font-style: italic; color: var(--primary); }
.wcard-tr { font-size: 14.5px; color: var(--on-surface); overflow-wrap: anywhere; }
.wcard-foot { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.wcard-mastery-label { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.mastery-track { flex: 1; height: 6px; border-radius: 999px; background: var(--surface-highest); overflow: hidden; }
.mastery-fill { display: block; height: 100%; border-radius: inherit; }
.wcard-pct { font-size: 12px; font-weight: 700; color: var(--on-surface-variant); min-width: 34px; text-align: right; }
.wcard .wrow-tools { opacity: .55; }
.wcard:hover .wrow-tools { opacity: 1; }
.st-badge {
  display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; padding: 3px 9px; border-radius: 999px;
  background: var(--surface-low); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--on-surface);
}
.st-badge .status-swatch { width: 8px; height: 8px; border-radius: 50%; }
.lib-more { align-self: center; }
.lib-empty { width: 100%; min-height: 240px; }
.fab {
  position: fixed; right: 18px; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 25;
  width: 56px; height: 56px; border-radius: 18px; border: 0; cursor: pointer;
  display: grid; place-items: center; color: #fff; background: var(--gradient-cta);
  box-shadow: 0 14px 28px -10px var(--primary);
}
html[data-theme="dark"] .fab { color: var(--on-primary); }
.btn.lib-add-word { display: none; }
@media (min-width: 1024px) { .fab { display: none; } .btn.lib-add-word { display: inline-flex; } }
.words-pane { padding-bottom: 60px; }
@media (min-width: 1024px) { .words-pane { padding-bottom: 0; } }
.form-grid.form-grid-tr { grid-template-columns: 1.6fr 1fr; }
.practice { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.practice-stage { --card-h: min(420px, 60dvh); min-height: var(--card-h); }
.practice-done { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 20px 0; text-align: center; color: var(--secondary); }

/* ---------- Reading: home, text cards, reader, tappable words ---------- */
.rhome { display: flex; flex-direction: column; gap: 16px; }
.continue-card, .ai-card {
  display: flex; align-items: center; gap: 14px; padding: 16px; cursor: pointer;
  border-radius: var(--radius-xl); background: var(--surface-lowest); box-shadow: var(--shadow-ambient);
  transition: transform .12s ease, box-shadow .15s ease;
}
.continue-card:hover, .ai-card:hover, .tcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
.continue-card { background: linear-gradient(160deg, var(--primary-soft), var(--surface-lowest)); }
.continue-main, .ai-card-main { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.continue-main .goal-track { width: 100%; margin-top: 4px; }
.continue-title { margin: 4px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.continue-sub { margin: 0; font-size: 13.5px; color: var(--on-surface-variant); }
.continue-arrow { flex: 0 0 auto; color: var(--primary); }
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.tcard {
  position: relative; display: flex; gap: 14px; padding: 14px; cursor: pointer; text-align: left;
  border-radius: var(--radius-xl); background: var(--surface-lowest); box-shadow: var(--shadow-ambient);
  transition: transform .12s ease, box-shadow .15s ease;
}
.tcover {
  flex: 0 0 auto; width: 64px; height: 88px; border-radius: 12px; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -.02em;
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 15%);
}
.tcover-A { background: linear-gradient(150deg, #0097a7, #58c9d6); }
.tcover-B { background: linear-gradient(150deg, #005da7, #68abff); }
.tcover-C { background: linear-gradient(150deg, #7f5200, #e0a640); }
.tcard-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.tcard-tags { display: flex; gap: 6px; }
.tcard-tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-low); color: var(--on-surface-variant); }
.tcard-title { margin: 2px 0 0; font-size: 16px; font-weight: 800; line-height: 1.25; }
.tcard-author { margin: 0; font-size: 13px; color: var(--on-surface-variant); }
.tcard-meta { margin: 2px 0 0; font-size: 12.5px; color: var(--faint); }
.tcard .mastery-track { margin-top: 6px; flex: 0 0 6px; }
.tcard-fill { background: var(--gradient-progress); }
.tcard-del { position: absolute; top: 8px; right: 8px; opacity: .5; }
.tcard:hover .tcard-del { opacity: 1; }
.check-row { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--on-surface-variant); line-height: 1.45; }
.check-row input { margin-top: 3px; accent-color: var(--primary); }
.reading-back-row { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 720px; }
.reading-back-title { font-family: var(--font-display); font-weight: 800; color: var(--on-surface-variant); }

.reader { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.reader-head { display: flex; align-items: center; gap: 10px; }
.reader-titles { display: flex; flex-direction: column; min-width: 0; }
.reader-title { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reader-chapter {
  max-width: 100%; border: 0; background: transparent; padding: 0; cursor: pointer;
  font: inherit; font-size: 13.5px; font-weight: 600; color: var(--primary); text-overflow: ellipsis;
}
.reader-author { font-size: 13.5px; color: var(--on-surface-variant); }
.reader-progress { display: flex; align-items: center; gap: 12px; font-size: 12.5px; font-weight: 600; color: var(--on-surface-variant); }
.reader-progress .goal-track { flex: 1; height: 6px; }
.reader-known { color: var(--primary); white-space: nowrap; }
.reader-page { padding: clamp(18px, 4vw, 32px); border-radius: var(--radius-xl); background: var(--surface-lowest); box-shadow: var(--shadow-ambient); }
.reader-chapter-title { margin: 0 0 18px; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.rpara { margin-bottom: 18px; }
.rpara-text { margin: 0; font-size: 18px; line-height: 1.75; color: var(--on-surface); max-width: 68ch; }
.rsent { border-radius: 4px; transition: background .2s ease; }
.rsent.speaking { background: color-mix(in srgb, var(--tertiary-fixed) 28%, transparent); }
.rpara-tools { display: flex; gap: 6px; margin-top: 6px; opacity: .55; transition: opacity .15s ease; }
.rpara:hover .rpara-tools, .rpara-tools:focus-within { opacity: 1; }
@media (hover: none) { .rpara-tools { opacity: 1; } }
.rtool {
  display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer; padding: 5px 10px; border-radius: 999px;
  background: var(--surface-low); color: var(--on-surface-variant); font-size: 12.5px; font-weight: 600;
}
.rtool:hover, .rtool[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); }
.rpara-ru { margin-top: 8px; padding: 12px 14px; border-radius: var(--radius-lg); background: var(--surface-low); color: var(--on-surface-variant); font-size: 15px; line-height: 1.6; }
.rpara-ru p { margin: 0 0 4px; }
.reader-nav { display: flex; justify-content: space-between; gap: 10px; }
.reader-nav .btn { flex: 1; max-width: 220px; }

/* tappable words; words from the user's cards get a dotted underline in their status colour */
.tw { cursor: pointer; border-radius: 3px; transition: background .12s ease; }
.tw:hover { background: var(--primary-soft); }
.tw-known { text-decoration: underline dotted 2px; text-underline-offset: 4px; }
.tw-new { text-decoration-color: var(--outline-variant); }
.tw-learning { text-decoration-color: var(--st-learning); }
.tw-review { text-decoration-color: var(--st-review); }
.tw-mastered { text-decoration-color: var(--st-mastered); }
.tw-active { background: color-mix(in srgb, var(--secondary-container) 70%, transparent); }

/* word sheet */
.wsheet { display: flex; flex-direction: column; gap: 12px; }
.wsheet-head { display: flex; align-items: center; gap: 10px; }
.wsheet-head .card-speak { position: static; }
.wsheet-meta { flex: 1; font-style: italic; color: var(--on-surface-variant); }
.wsheet-tr { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.wsheet-loading { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--on-surface-variant); }
.wsheet-sentence { padding: 12px 14px; border-radius: var(--radius-lg); background: var(--surface-low); }
.wsheet-en { margin: 0; line-height: 1.55; }
.wsheet-ru { margin: 6px 0 0; color: var(--on-surface-variant); font-size: 14px; line-height: 1.5; }
.wsheet-note { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 600; color: var(--secondary); }
.wsheet-add { display: flex; gap: 8px; flex-wrap: wrap; }
.wsheet-add .input-sm { flex: 1; min-width: 150px; }

/* ---------- Pronunciation check ---------- */
.pron { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.pron-btn {
  display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer; padding: 8px 14px; border-radius: 999px;
  background: var(--surface-high); color: var(--on-surface); font-size: 13.5px; font-weight: 700;
}
.pron-btn:hover { background: var(--surface-highest); }
.pron-btn.on { background: var(--error); color: #fff; animation: pronPulse 1.2s ease-in-out infinite; }
@keyframes pronPulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--error) 18%, transparent); } }
.pron-result { display: flex; align-items: flex-start; gap: 10px; width: 100%; }
.pron-score { flex: 0 0 auto; padding: 3px 10px; border-radius: 999px; font-weight: 800; font-size: 13px; }
.pron-score.good { background: var(--secondary-container); color: var(--on-secondary-container); }
.pron-score.ok { background: var(--primary-soft); color: var(--primary); }
.pron-score.low { background: color-mix(in srgb, var(--error) 14%, transparent); color: var(--error); }
.pron-heard { font-size: 14px; color: var(--on-surface-variant); }
.pron-text { margin: 0; font-size: 15px; line-height: 1.7; }
.pron-ok { color: var(--on-surface); }
.pron-miss { color: var(--error); text-decoration: underline wavy 1px; text-underline-offset: 4px; }
.pron-error { font-size: 13px; color: var(--error); }
.rpara-practice { margin-top: 10px; padding: 12px 14px; border-radius: var(--radius-lg); background: var(--surface-low); display: flex; flex-direction: column; gap: 8px; }
.rpara-practice .field-hint { margin: 0; }

/* ---------- Bottom sheet (Modal sheet) ---------- */
@media (max-width: 1023.98px) {
  .modal-scrim.modal-sheet { align-items: flex-end; padding: 0; }
  .modal-sheet .modal {
    max-width: none; border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    padding-bottom: env(safe-area-inset-bottom); animation: sheetUp .26s cubic-bezier(.2,.8,.2,1);
  }
}
@keyframes sheetUp { from { transform: translateY(100%); } }

/* ---------- Language select (first launch) ---------- */
.lang-select {
  min-height: 100dvh; display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.lang-select-card {
  width: 100%; max-width: 420px; text-align: center;
}
.lang-select-title { font-family: var(--font-display); font-size: 28px; font-weight: 800; margin: 0 0 6px; color: var(--on-surface); }
.lang-select-sub { color: var(--on-surface-variant); font-size: 14px; margin: 0 0 28px; }
.auth-card { background: var(--surface-lowest); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); padding: 32px 24px 24px; }
.auth-card .form { text-align: left; }
.auth-brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 22px; }
.lang-select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lang-opt {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  border: 0; background: var(--surface-lowest); box-shadow: var(--shadow-ambient);
  border-radius: var(--radius-xl); padding: 22px 14px; transition: all .16s ease;
}
.lang-opt:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
.lang-opt-flag { font-size: 32px; }
.lang-opt-name { font-weight: 600; font-size: 14.5px; color: var(--on-surface); }

.icon-btn {
  display: grid; place-items: center;
  width: 40px; height: 40px; border-radius: 999px;
  border: 0; background: transparent;
  color: var(--on-surface); transition: all .16s ease;
}
.icon-btn:hover { background: var(--surface-low); }
.icon-btn.sm { width: 32px; height: 32px; border-color: transparent; background: transparent; }
.icon-btn.sm:hover { background: var(--surface-low); }
.icon-btn.danger:hover { color: var(--error); background: color-mix(in srgb, var(--error) 10%, transparent); }

/* ---------- Content ---------- */
.content { flex: 1; width: 100%; max-width: 980px; margin: 0 auto; padding: 20px 16px calc(96px + env(safe-area-inset-bottom)); }

/* ---------- Study ---------- */
.study { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.category { display: flex; flex-direction: column; align-items: center; gap: 28px; }
.category .selector { width: 100%; max-width: 640px; margin: 0 auto; }
.selector { width: 100%; max-width: 640px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-cta-study { font-size: 15px; padding: 13px 22px; }

/* ---------- Reading (AI text) ---------- */
.reading { display: flex; flex-direction: column; align-items: center; gap: 24px; }

/* flip card holding settings (front) / generated text (back) */
.reading-scene { width: 100%; max-width: 720px; perspective: 1800px; }
.reading-inner {
  position: relative; display: grid; width: 100%;
  transform-style: preserve-3d;
  transition: transform .62s cubic-bezier(.2,.7,.2,1);
}
.reading-scene.is-flipped .reading-inner { transform: rotateY(180deg); }
.reading-face {
  grid-area: 1 / 1; width: 100%;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  transition: opacity 0s linear .31s;
}
.reading-back { transform: rotateY(180deg); }
.reading-scene:not(.is-flipped) .reading-back { opacity: 0; pointer-events: none; }
.reading-scene.is-flipped .reading-front { opacity: 0; pointer-events: none; }

.reading-controls {
  width: 100%; display: flex; flex-direction: column; gap: 16px;
  background: var(--surface-lowest); border: 0; box-shadow: var(--shadow-ambient);
  border-radius: var(--radius-xl); padding: clamp(18px, 3vw, 28px);
}
.reading-controls .seg { flex-wrap: wrap; }
.reading-controls .btn-cta-study { align-self: stretch; justify-content: center; }
.reading-result {
  width: 100%; background: var(--surface-lowest);
  border: 0; border-radius: var(--radius-xl); box-shadow: var(--shadow-ambient);
  padding: clamp(18px, 3.5vw, 30px);
}
.reading-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.reading-head-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.reading-title { font-size: 20px; font-weight: 700; margin: 0; color: var(--on-surface); }
.reading-meta { display: flex; align-items: center; gap: 8px; }
.reading-level {
  font-size: 12px; font-weight: 700; letter-spacing: .02em; padding: 2px 8px; border-radius: 999px;
  background: var(--primary-soft); color: var(--primary); border: 0;
}
.reading-counter { font-size: 12.5px; font-weight: 600; color: var(--on-surface-variant); }
.reading-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 18px 0 4px; }
.reading-nav-btn {
  flex: 0 0 auto; width: 36px; height: 36px; border-radius: 999px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface-low); color: var(--on-surface); border: 1px solid var(--ghost);
  transition: background-color .15s ease, color .15s ease, border-color .15s ease, opacity .15s ease;
}
.reading-nav-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.reading-nav-btn:disabled { opacity: .35; cursor: default; }
.reading-dots { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 7px; }
.reading-dot {
  width: 9px; height: 9px; border-radius: 999px; cursor: pointer; padding: 0;
  background: var(--surface-highest); border: 0;
  transition: background-color .15s ease, border-color .15s ease, transform .15s ease;
}
.reading-dot:hover { border-color: var(--primary); }
.reading-dot.on { background: var(--primary); border-color: var(--primary); transform: scale(1.25); }
.reading-bulb {
  flex: 0 0 auto; width: 38px; height: 38px; border-radius: 999px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface-low); color: var(--on-surface-variant); border: 1px solid var(--ghost);
  transition: background-color .15s ease, color .15s ease, border-color .15s ease;
}
.reading-bulb:hover { color: var(--on-surface); }
.reading-bulb[aria-pressed="true"] {
  background: var(--primary-soft); color: var(--primary); border-color: transparent;
}
.reading-text { font-size: 16px; line-height: 1.7; color: var(--on-surface); margin: 0; }
.reading-sentence { cursor: pointer; border-radius: 4px; transition: background-color .15s ease; }
.reading-sentence:hover { background: var(--surface-low); }
.reading-sentence.open { background: var(--primary-soft); }
.reading-sentence-ru {
  display: block; margin: 6px 0 10px; padding: 8px 12px;
  font-size: 14.5px; line-height: 1.6; color: var(--on-surface-variant);
  background: var(--surface-low); border-radius: 12px;
}
.reading-hl {
  background: #FFE58A; color: #4A3B00; border-radius: 3px; padding: 0 2px; font-weight: 600;
}
html[data-theme="dark"] .reading-hl { background: #7A6A1E; color: #FFF4C2; }
.reading-text-ru { margin-top: 16px; padding: 14px 16px; border-radius: var(--radius-lg); background: var(--surface-low); color: var(--on-surface-variant); }
.reading-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 0; }
.reading-words { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
.reading-word-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.reading-word-tag {
  font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; cursor: pointer;
  background: var(--surface-low); color: var(--on-surface-variant); border: 1px solid var(--ghost);
  transition: background-color .15s ease, color .15s ease, border-color .15s ease;
}
.reading-word-tag.used { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.reading-word-tag.active { background: #FFE58A; color: #4A3B00; border-color: #E8C84A; }
html[data-theme="dark"] .reading-word-tag.active { background: #7A6A1E; color: #FFF4C2; border-color: #A08A2A; }

.chip {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid transparent; background: var(--surface-high);
  color: var(--on-surface); font-size: 13.5px; font-weight: 600;
  padding: 8px 14px; border-radius: 999px; transition: all .16s ease;
}
.chip:hover { transform: translateY(-1px); box-shadow: var(--shadow-ambient); }
.chip-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.chip-count { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.chip-check { color: var(--primary); margin-left: -2px; }
.chip-on { background: var(--primary); color: #fff; }
.chip-on .chip-check { color: inherit; }
.chip-on .chip-dot { box-shadow: 0 0 0 2px #fff; }
html[data-theme="dark"] .chip-on { color: var(--on-primary); }
.chip-on .chip-count { color: inherit; opacity: .75; }
.chip-all { font-weight: 700; }

/* ---------- Choice (multiple-choice quiz) ---------- */
.choice { display: flex; justify-content: center; width: 100%; padding: clamp(8px, 3vw, 24px) 0; }
.choice-card {
  width: min(480px, 100%); display: flex; flex-direction: column; align-items: center; gap: 26px;
  background: var(--surface-lowest); border: 0; border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card); padding: 40px 30px; position: relative;
}
.choice-tag {
  position: absolute; top: 14px; left: 14px;
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--secondary-container); border: 0; border-radius: 999px;
  padding: 5px 12px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--on-secondary-container);
}
.choice-tag .dot { width: 7px; height: 7px; border-radius: 50%; }
.choice-tag-btn {
  z-index: 4; cursor: pointer; font-family: inherit; line-height: 1;
  transition: border-color .15s ease, background .15s ease, transform .1s ease;
}
.choice-tag-btn:hover { filter: brightness(.97); }
.choice-tag-btn:active { transform: scale(.96); }
.choice-prompt-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 18px; width: 100%; }
.choice-prompt-row .card-speak { position: static; }
.choice-prompt { font-family: var(--font-display); font-size: 34px; font-weight: 800; letter-spacing: -.025em; text-align: center; line-height: 1.15; overflow-wrap: break-word; }
.choice-ipa { font-style: italic; font-size: 16px; color: var(--on-surface-variant); text-align: center; margin-top: -10px; }
.choice-options { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.choice-opt {
  width: 100%; border: 1px solid transparent; background: var(--surface-low); color: var(--on-surface);
  font-size: 15px; font-weight: 600; padding: 15px 18px; border-radius: var(--radius-lg); text-align: left;
  transition: all .15s ease;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.choice-opt-label { flex: 1; }
.choice-opt .card-speak { position: static; flex: 0 0 auto; }
.choice-opt:hover:not(:disabled) { background: var(--primary-soft); transform: translateY(-1px); }
.choice-opt:disabled { cursor: default; }
.choice-opt-correct { background: var(--secondary-container); color: var(--on-secondary-container); }
.choice-opt-wrong { background: color-mix(in srgb, var(--error) 14%, var(--surface-low)); color: var(--error); }

/* ---------- Fill (blank-the-word cards) ---------- */
.fill { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; }
.fill-scene {
  width: min(440px, 100%); height: var(--card-h, 460px);
  perspective: 1600px; cursor: pointer; user-select: none;
  position: relative; touch-action: none; outline: none; -webkit-tap-highlight-color: transparent;
}
.fill-inner {
  position: relative; width: 100%; height: 100%;
  transform-style: preserve-3d; transition: transform .62s cubic-bezier(.2,.7,.2,1);
}
.fill-scene.is-flipped .fill-inner { transform: rotateY(180deg); }
.fill-face {
  position: absolute; inset: 0;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: var(--radius-xl); background: var(--surface-lowest);
  border: 0; box-shadow: var(--shadow-card);
  overflow: hidden; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; padding: 44px 30px; text-align: center;
  transition: opacity 0s linear .31s;
}
.fill-scene:not(.is-flipped) .fill-back { opacity: 0; pointer-events: none; }
.fill-scene.is-flipped .fill-front { opacity: 0; pointer-events: none; }
.fill-front .choice-tag { top: 14px; left: 14px; }
.fill-sentence {
  font-family: var(--font-display); font-weight: 600; font-size: clamp(21px, 5vw, 28px); line-height: 1.5;
  color: var(--on-surface); margin: 0; overflow-wrap: break-word;
}
.fill-blank {
  display: inline-block; min-width: 84px; vertical-align: baseline;
  border-bottom: 3px solid var(--primary); margin: 0 4px;
}
.fill-sentence-tr {
  font-size: clamp(15px, 3.5vw, 18px); line-height: 1.45;
  color: var(--on-surface-variant); margin: 0; padding-top: 14px;
  border-top: 1px solid var(--ghost); width: 80%;
}
.fill-back {
  transform: rotateY(180deg);
  background: linear-gradient(180deg, color-mix(in srgb, var(--hue, var(--primary)) 7%, var(--surface-lowest)), var(--surface-lowest));
}

/* ---------- Stage / card ---------- */
.stage { --card-h: clamp(300px, calc(100dvh - 460px), 460px); width: 100%; display: grid; place-items: center; min-height: var(--card-h); position: relative; z-index: 0; }
@media (min-width: 1024px) { .stage { --card-h: clamp(340px, calc(100dvh - 380px), 460px); } }
.card-scene {
  width: min(380px, 100%); height: var(--card-h, 460px);
  perspective: 1600px; cursor: pointer; user-select: none;
  position: relative; touch-action: none;
  outline: none; -webkit-tap-highlight-color: transparent;
}
.card-scene.swipe-known, .card-scene.swipe-unknown, .card-scene.swipe-shuffle,
.card-scene.swipe-shuffle-hint, .card-scene.swipe-skip-hint, .card-scene.swipe-skip,
.fill-scene.swipe-known, .fill-scene.swipe-unknown, .fill-scene.swipe-shuffle,
.fill-scene.swipe-shuffle-hint, .fill-scene.swipe-skip-hint, .fill-scene.swipe-skip { position: relative; z-index: 30; }
.card-scene.swipe-known .card-face,
.fill-scene.swipe-known .fill-face { box-shadow: 0 0 0 3px var(--secondary), var(--shadow-card); }
.card-scene.swipe-unknown .card-face,
.fill-scene.swipe-unknown .fill-face { box-shadow: 0 0 0 3px var(--error), var(--shadow-card); }
.card-scene.swipe-shuffle-hint .card-face,
.fill-scene.swipe-shuffle-hint .fill-face { box-shadow: 0 0 0 3px #3B82F6, var(--shadow-card); }
.card-scene.swipe-skip-hint .card-face,
.card-scene.swipe-skip .card-face,
.fill-scene.swipe-skip-hint .fill-face,
.fill-scene.swipe-skip .fill-face { box-shadow: 0 0 0 3px #9CA3AF, var(--shadow-card); }
.swipe-stamp {
  position: absolute; top: 25px; z-index: 5;
  font-size: 18px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  padding: 8px 18px; border-radius: 999px; pointer-events: none;
}
.card-scene.swipe-known .swipe-stamp,
.fill-scene.swipe-known .swipe-stamp { left: 48px; color: var(--secondary); border: 2px solid var(--secondary); transform: rotate(-8deg); }
.card-scene.swipe-unknown .swipe-stamp,
.fill-scene.swipe-unknown .swipe-stamp { right: 48px; color: var(--error); border: 2px solid var(--error); transform: rotate(8deg); }
.swipe-stamp-shuffle {
  left: 50%; top: 47.25px; transform: translateX(-50%); color: var(--primary); border: 2px solid var(--primary);
  display: inline-flex; align-items: center; gap: 6px;
}
.swipe-stamp-skip {
  left: 50%; bottom: 18px; top: auto; transform: translateX(-50%); color: var(--primary); border: 2px solid var(--primary);
  font-size: 21.6px;
}

/* ---------- Shuffle animation ---------- */
.card-scene.swipe-shuffle .card-inner,
.fill-scene.swipe-shuffle .fill-inner { opacity: 0; transition: opacity .12s ease; }
.shuffle-fx {
  position: absolute; inset: 0; z-index: 6;
  display: grid; place-items: center;
  pointer-events: none;
}
.shuffle-card {
  position: absolute; width: 100%; height: 100%;
  border-radius: var(--radius-xl); background: var(--surface-lowest);
  border: 0; box-shadow: var(--shadow-card);
}
.shuffle-card.sc-1 { animation: shuffleCard1 .5s ease-in-out; }
.shuffle-card.sc-2 { animation: shuffleCard2 .5s ease-in-out .03s; }
.shuffle-card.sc-3 { animation: shuffleCard3 .5s ease-in-out .06s; }
.shuffle-icon {
  position: relative; z-index: 7; color: var(--primary);
  background: color-mix(in srgb, var(--surface-lowest) 88%, transparent);
  border: 1px solid var(--ghost); border-radius: 999px;
  padding: 12px; box-shadow: var(--shadow-ambient);
  animation: shuffleIcon .5s ease-in-out;
}
@keyframes shuffleCard1 {
  0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
  30% { transform: translate(-46px, -22px) rotate(-14deg); opacity: 1; }
  60% { transform: translate(40px, 14px) rotate(10deg); opacity: 1; }
  100% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
}
@keyframes shuffleCard2 {
  0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
  30% { transform: translate(48px, -16px) rotate(12deg); opacity: 1; }
  60% { transform: translate(-42px, 18px) rotate(-9deg); opacity: 1; }
  100% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
}
@keyframes shuffleCard3 {
  0% { transform: translate(0, 6px) rotate(0deg); opacity: 1; }
  30% { transform: translate(-10px, -34px) rotate(-5deg); opacity: 1; }
  60% { transform: translate(8px, 28px) rotate(6deg); opacity: 1; }
  100% { transform: translate(0, 6px) rotate(0deg); opacity: 0; }
}
@keyframes shuffleIcon {
  0% { transform: scale(.6) rotate(0deg); opacity: 0; }
  25% { transform: scale(1.1) rotate(90deg); opacity: 1; }
  75% { transform: scale(1) rotate(270deg); opacity: 1; }
  100% { transform: scale(.6) rotate(360deg); opacity: 0; }
}
.card-inner {
  position: relative; width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform .62s cubic-bezier(.2,.7,.2,1);
}
.card-scene.is-flipped .card-inner { transform: rotateY(180deg); }
.card-scene.is-example .card-inner { transform: rotateX(180deg); }
.card-face {
  position: absolute; inset: 0;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: var(--radius-xl); background: var(--surface-lowest);
  border: 0; box-shadow: var(--shadow-card);
  overflow: hidden; display: flex; flex-direction: column;
  /* opacity swap reinforces backface culling (also keeps flat renderers correct) */
  transition: opacity 0s linear .31s;
}
.card-scene:not(.is-flipped):not(.is-example) .card-back { opacity: 0; pointer-events: none; }
.card-scene.is-flipped:not(.is-example) .card-front { opacity: 0; pointer-events: none; }
.card-scene.is-example .card-front,
.card-scene.is-example .card-back { opacity: 0; pointer-events: none; }
.card-scene:not(.is-example) .card-example { opacity: 0; pointer-events: none; }
.card-front { padding: 0; }
.card-photo { height: 34%; flex: 0 0 auto; overflow: hidden; background: var(--surface-low); }
.card-photo-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-ph {
  width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background:
    radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--ph-hue) 22%, var(--surface-lowest)) 0%, var(--surface-low) 70%);
  color: color-mix(in srgb, var(--ph-hue) 55%, var(--on-surface-variant));
}
.photo-ph-icon { opacity: .55; }
.photo-ph-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: lowercase; opacity: .7; }
.card-body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; padding: 18px 24px; }
.card-word { font-family: var(--font-display); font-size: 46px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; text-align: center; color: var(--on-surface); overflow-wrap: break-word; word-break: break-word; max-width: 100%; }
.card-ipa { font-style: italic; font-size: 19px; color: var(--on-surface-variant); white-space: normal; text-align: center; overflow-wrap: break-word; max-width: 100%; }
.card-tag {
  position: absolute; top: 14px; left: 14px;
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--secondary-container); border: 0; border-radius: 999px;
  padding: 5px 12px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--on-secondary-container);
}
.card-tag .dot { width: 7px; height: 7px; border-radius: 50%; }
.card-tag-btn {
  z-index: 4; cursor: pointer; font-family: inherit; line-height: 1;
  transition: border-color .15s ease, background .15s ease, transform .1s ease;
}
.card-tag-btn:hover { filter: brightness(.97); }
.card-tag-btn:active { transform: scale(.96); }
.card-bulb {
  position: absolute; top: 14px; right: 14px; z-index: 4;
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 999px;
  background: color-mix(in srgb, var(--surface-lowest) 86%, transparent);
  backdrop-filter: blur(6px);
  border: 1px solid var(--ghost);
  color: var(--faint); cursor: not-allowed;
  transition: color .2s, border-color .2s, background-color .2s, transform .15s;
}
.card-bulb-on {
  color: #E8A93E; border-color: color-mix(in srgb, #E8A93E 40%, transparent);
  background: color-mix(in srgb, #E8A93E 14%, var(--surface-lowest));
  cursor: pointer;
}
.card-bulb-on:hover { transform: scale(1.08); }
.card-speak {
  position: absolute; top: 14px; right: 54px; z-index: 4;
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 999px;
  background: color-mix(in srgb, var(--surface-lowest) 86%, transparent);
  backdrop-filter: blur(6px);
  border: 1px solid var(--ghost);
  color: var(--on-surface); cursor: pointer;
  transition: color .2s, border-color .2s, background-color .2s, transform .15s;
}
.card-speak:hover { transform: scale(1.08); color: var(--primary); border-color: color-mix(in srgb, var(--primary) 40%, transparent); }
.card-example {
  transform: rotateX(180deg);
  align-items: center; justify-content: center; gap: 14px; padding: 40px 30px; text-align: center;
  background:
    linear-gradient(180deg, color-mix(in srgb, #E8A93E 9%, var(--surface-lowest)), var(--surface-lowest));
}
.example-text { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1.4; color: var(--on-surface); }
.example-divider { width: 40%; height: 1px; background: var(--ghost); border: none; }
.example-text-tr { font-size: 18px; line-height: 1.4; color: var(--on-surface-variant); }
/* back */
.card-back {
  transform: rotateY(180deg);
  align-items: center; justify-content: center; gap: 14px; padding: 40px 30px; text-align: center;
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--hue) 7%, var(--surface-lowest)), var(--surface-lowest));
}
.back-label { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--on-surface-variant); }
.card-tr { font-family: var(--font-display); font-size: 38px; font-weight: 800; line-height: 1.12; letter-spacing: -.025em; color: var(--on-surface); overflow-wrap: break-word; word-break: break-word; max-width: 100%; }
.back-word { font-size: 15px; color: var(--on-surface-variant); font-weight: 500; }
.back-ipa { font-style: italic; color: var(--faint); }

/* empty */
.empty-card {
  width: min(380px, 86vw); min-height: 360px; border-radius: var(--radius-xl);
  border: 0; background: var(--surface-low);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 30px;
  color: var(--on-surface-variant); text-align: center;
}
.empty-title { font-weight: 700; font-size: 17px; color: var(--on-surface); margin: 6px 0 0; }
.empty-sub { font-size: 13.5px; margin: 0 0 6px; }

/* controls */
.controls { display: flex; gap: 10px; align-items: center; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid transparent; border-radius: 999px;
  font-size: 14px; font-weight: 600; padding: 11px 20px; transition: all .16s ease;
}
.btn.lg { padding: 14px 26px; font-size: 15px; }
.btn.sm { padding: 7px 13px; font-size: 13px; }
.btn-primary { background: var(--gradient-cta); color: #fff; box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--primary) 55%, transparent); }
html[data-theme="dark"] .btn-primary { color: var(--on-primary); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 26px -8px color-mix(in srgb, var(--primary) 60%, transparent); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-ghost { background: transparent; color: var(--primary); border-color: transparent; font-weight: 700; }
.btn-ghost:hover { background: var(--primary-soft); }
.btn-ghost.danger { color: var(--error); }
.btn-soft { background: var(--surface-high); color: var(--on-surface); }
.btn-soft:hover { background: var(--surface-highest); }
.btn-danger { background: var(--error); color: #fff; }
.btn-danger:hover { transform: translateY(-1px); }
.btn-success { background: var(--secondary-container); color: var(--on-secondary-container); }
.btn-success:hover { transform: translateY(-1px); }

/* ---------- Library ---------- */
.library { width: 100%; }
.lib-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.lib-search { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
.lib-intro { margin-bottom: 18px; }
.lib-search .input { padding-left: 36px; }
.lib-search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search-results { padding: 6px; display: flex; flex-direction: column; }
.wrow-group { color: var(--faint); font-size: 12px; font-weight: 600; margin-top: 3px; }
.lib-title { font-family: var(--font-display); font-size: 34px; font-weight: 800; margin: 0; letter-spacing: -.03em; }
.lib-sub { color: var(--on-surface-variant); font-size: 14px; margin: 4px 0 0; }
.groups-list { display: flex; flex-direction: column; gap: 14px; }
.grp { background: var(--surface-lowest); border: 0; border-radius: var(--radius-xl); overflow: hidden; box-shadow: var(--shadow-ambient); }
.grp-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.grp-toggle {
  display: flex; align-items: center; gap: 10px; flex: 1;
  border: 0; background: transparent; color: var(--on-surface); padding: 4px; border-radius: 8px; text-align: left;
}
.grp-toggle:hover { color: var(--primary); }
.grp-dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
.grp-name { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.grp-count { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
.grp-tools { display: flex; align-items: center; gap: 6px; }
.actions-menu { position: relative; }
.actions-menu-pop {
  position: fixed; z-index: 60;
  display: flex; flex-direction: column; min-width: 170px; padding: 6px;
  background: var(--surface-lowest); border: 0; border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
}
.actions-menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px;
  border: 0; background: transparent; color: var(--on-surface); font-size: 13.5px; border-radius: 7px; text-align: left; cursor: pointer;
}
.actions-menu-item:hover { background: var(--surface-low); }
.actions-menu-item.danger { color: var(--error); }
.actions-menu-item.danger:hover { background: color-mix(in srgb, var(--error) 10%, transparent); }
.actions-menu-item svg { flex: 0 0 auto; width: 15px; height: 15px; }
.grp-body { background: var(--surface-lowest); }
.grp-sub { border: 0; border-radius: 0; box-shadow: none; margin: 0 0 0 22px; }
.grp-sub:last-child { border-bottom: 0; }
.grp-sub .grp-head { padding: 10px 14px; }
.grp-sub .grp-name { font-size: 14.5px; }
.word-rows { padding: 6px; display: flex; flex-direction: column; }
.row-empty { color: var(--faint); font-size: 13.5px; padding: 16px; text-align: center; }
.wrow { display: flex; align-items: center; gap: 14px; padding: 10px; border-radius: 11px; transition: background .14s ease; }
.wrow:hover { background: var(--surface-low); }
.wrow:nth-child(even) { background: color-mix(in srgb, var(--surface-low) 55%, transparent); }
.wrow:nth-child(even):hover { background: var(--surface-low); }
.wrow-thumb { width: 52px; height: 52px; border-radius: 14px; overflow: hidden; flex: 0 0 auto; }
.wrow-thumb .photo-ph-label { display: none; }
.wrow-thumb .photo-ph-icon { width: 18px; height: 18px; }
.wrow-main { flex: 1; min-width: 0; }
.wrow-top { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; min-width: 0; }
.wrow-word { font-weight: 600; font-size: 16px; overflow-wrap: break-word; }
.wrow-ipa { font-style: italic; color: var(--on-surface-variant); font-size: 14px; overflow-wrap: break-word; }
.wrow-tr { color: var(--on-surface-variant); font-size: 14px; margin-top: 1px; overflow-wrap: break-word; }
.wrow-tools { display: flex; gap: 3px; opacity: .5; transition: opacity .14s; }
.wrow:hover .wrow-tools { opacity: 1; }

/* ---------- Modal ---------- */
.modal-scrim {
  position: fixed; inset: 0; z-index: 50;
  background: var(--scrim);
  backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; padding: 18px;
  animation: fade .18s ease;
}
@keyframes fade { from { opacity: 0; } }
.spinner {
  display: inline-block; width: 15px; height: 15px; flex: none;
  border: 2px solid color-mix(in srgb, currentColor 30%, transparent);
  border-top-color: currentColor; border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------------- Toast (bottom-right notifications) ---------------- */
.toast-stack {
  position: fixed; right: 18px; bottom: 18px; z-index: 200;
  display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
  max-width: min(360px, calc(100vw - 36px));
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 16px; border-radius: var(--radius-lg);
  background: var(--surface-lowest); border: 0;
  box-shadow: var(--shadow-card);
  animation: toastIn .28s cubic-bezier(.2,.8,.2,1);
  border-left: 4px solid var(--primary);
}
.toast.is-out { animation: toastOut .22s ease forwards; }
.toast.toast-success { border-left-color: var(--secondary); }
.toast.toast-error { border-left-color: var(--error); }
.toast-icon { flex: none; margin-top: 1px; }
.toast.toast-success .toast-icon { color: var(--secondary); }
.toast.toast-error .toast-icon { color: var(--error); }
.toast-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.toast-title { font-weight: 650; font-size: 14px; }
.toast-msg { font-size: 13px; color: var(--on-surface-variant); }
.toast-action {
  margin-top: 6px; align-self: flex-start;
  background: none; border: none; padding: 0; cursor: pointer;
  color: var(--primary); font: inherit; font-size: 13px; font-weight: 600;
}
.toast-close {
  flex: none; background: none; border: none; cursor: pointer;
  color: var(--on-surface-variant); padding: 2px; margin: -2px -4px -2px 0; line-height: 0;
}
.toast-close:hover { color: var(--on-surface); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(.98); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(8px) scale(.98); } }

.modal {
  width: 100%; max-width: 480px; background: var(--surface-lowest);
  border: 0; border-radius: var(--radius-xl); box-shadow: var(--shadow-card);
  animation: pop .22s cubic-bezier(.2,.8,.2,1); max-height: 92vh; overflow: auto;
}
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 12px; }
.modal-head h3 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.modal-body { padding: 4px 20px 20px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 0 20px 20px; }
.confirm-text { font-size: 14.5px; color: var(--on-surface-variant); line-height: 1.5; margin: 4px 0 8px; }
.confirm-text strong { color: var(--on-surface); }

/* ---------- Forms ---------- */
.form { display: flex; flex-direction: column; gap: 16px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field-label { font-size: 12.5px; font-weight: 600; color: var(--on-surface-variant); letter-spacing: .01em; }
.field-label .opt { font-style: normal; font-weight: 500; color: var(--faint); }
.input {
  width: 100%; border: 1px solid var(--ghost); background: var(--surface-lowest);
  color: var(--on-surface); border-radius: 14px; padding: 12px 14px; font-size: 15px; font-family: inherit;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.input:focus { outline: none; border-color: transparent; box-shadow: inset 0 -2px 0 var(--primary), 0 6px 16px -10px var(--primary); }
.input.mono { font-style: italic; }
textarea.input { resize: vertical; line-height: 1.5; min-height: 120px; }
textarea.input.mono { font-style: normal; }
.field-hint { font-size: 12.5px; color: var(--on-surface-variant); line-height: 1.5; margin: 0; }
.field-label-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.photo-edit { display: flex; align-items: flex-start; gap: 14px; }
.photo-edit-preview {
  width: 84px; height: 84px; flex: 0 0 auto; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--ghost); background: var(--surface-low);
}
.photo-edit-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-edit-empty { display: flex; align-items: center; justify-content: center; color: var(--faint); }
.photo-edit-actions { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.field-hint code { background: var(--surface-low); border-radius: 5px; padding: 1px 5px; font-family: ui-monospace, monospace; }
.lib-head-actions { display: flex; gap: 10px; align-items: center; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--surface-low); border-radius: 999px; }
.seg-btn { background: transparent; color: var(--on-surface-variant); border: none; border-radius: 999px; font-size: 13.5px; font-weight: 600; padding: 8px 14px; cursor: pointer; transition: all .14s ease; }
.seg-btn:hover { color: var(--on-surface); }
.seg-btn.on { background: var(--surface-lowest); color: var(--primary); box-shadow: var(--shadow-ambient); }
.group-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.gp-opt {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid transparent; background: var(--surface-high); color: var(--on-surface);
  font-size: 13.5px; font-weight: 600; padding: 8px 14px; border-radius: 999px; transition: all .15s ease;
}
.gp-opt:hover { background: var(--surface-highest); }
.gp-on { background: var(--primary); color: #fff; }

.form-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
.swatches { display: flex; flex-wrap: wrap; gap: 9px; }
.swatch {
  width: 34px; height: 34px; border-radius: 9px; border: 2px solid transparent;
  display: grid; place-items: center; color: #fff; transition: transform .14s ease;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
}
.swatch:hover { transform: scale(1.08); }
.swatch.on { border-color: var(--on-surface); }

/* ---------- Responsive ---------- */
@media (max-width: 560px) {

}
